<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUPR Nights · PickleBee by 71</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GLASS + BENTO THEME
   Same brand palette as before (lime / cyan / pink / orange on sage);
   surfaces are now frosted glass tiles over soft colour blobs.
   ============================================================ */
:root{
  --bg:#e9efe9; --surface:#f4f8f3; --surface-2:#eef3ed;
  --lime:#a8d600; --lime-deep:#8bb800;
  --pink:#ff2e9a; --cyan:#12cccc; --orange:#ff8f00;
  --ink:#1c2a1f; --muted:#5f7262;
  --purple:#6a00f4;
  --glass:rgba(255,255,255,.52);
  --glass-strong:rgba(255,255,255,.74);
  --glass-edge:rgba(255,255,255,.78);
  --glass-shadow:0 12px 32px rgba(60,80,55,.12),0 2px 6px rgba(60,80,55,.06);
  --glass-inset:inset 0 1px 0 rgba(255,255,255,.9);
  --r:28px; --r-sm:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Nunito',sans-serif;color:var(--ink);padding:28px 20px 24px;min-height:100vh;
  background:var(--bg);-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;
}
/* Soft colour blobs: this is what the glass actually blurs */
.blobs{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;}
.b1{width:480px;height:480px;left:-120px;top:-100px;background:var(--lime);opacity:.55;}
.b2{width:420px;height:420px;right:-100px;top:10%;background:var(--cyan);opacity:.45;}
.b3{width:380px;height:380px;left:30%;top:42%;background:var(--pink);opacity:.26;}
.b4{width:360px;height:360px;right:4%;bottom:-100px;background:var(--orange);opacity:.36;}
.b5{width:340px;height:340px;left:-80px;top:68%;background:var(--cyan);opacity:.28;}

/* bento grid */
.wrap{max-width:1080px;margin:0 auto;position:relative;z-index:1;
  display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:stretch;}
#screenSelect.active{display:contents;}
#catGrid{display:contents;}
.wrap.on-form header.hero{grid-column:1/-1;}
#screenForm{grid-column:1/-1;}

/* glass tile base */
.tile{
  position:relative;border-radius:var(--r);overflow:hidden;padding:22px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid var(--glass-edge);
  box-shadow:var(--glass-shadow),var(--glass-inset);
  animation:rise .45s ease both;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .tile{background:var(--glass-strong);}
}
.tile[data-accent]::before{
  content:'';position:absolute;left:-60px;top:-60px;width:200px;height:200px;border-radius:50%;
  background:var(--ac);opacity:.28;filter:blur(40px);pointer-events:none;
}
.tile[data-accent=lime]{--ac:var(--lime);}
.tile[data-accent=pink]{--ac:var(--pink);}
.tile[data-accent=cyan]{--ac:var(--cyan);}
.tile[data-accent=orange]{--ac:var(--orange);}
.tile>*{position:relative;}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

/* screens */
.screen{display:none;}
.screen.active{display:block;animation:rise .4s ease both;}

/* ---------- HERO ---------- */
header.hero{grid-column:span 8;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:30px;text-align:left;}
.hero-top{display:flex;align-items:center;gap:18px;}
.logo{flex:none;width:84px;height:84px;object-fit:contain;border-radius:50%;padding:12px;
  background:var(--glass-strong);border:1px solid var(--glass-edge);
  box-shadow:0 6px 18px rgba(60,80,55,.14),var(--glass-inset);}
.eyebrow{font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:.5px;color:#0aa8a8;
  text-transform:uppercase;font-size:.82rem;margin-bottom:4px;}
h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1.08;}
h1 .hl{color:var(--pink);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chips:empty{display:none;}
.chip{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:.8rem;
  padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.6);
  border:1px solid var(--glass-edge);color:var(--ink);}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime-deep);box-shadow:0 0 0 4px rgba(168,214,0,.28);}
.dot.off{background:var(--pink);box-shadow:0 0 0 4px rgba(255,46,154,.2);}

/* Week 21 only — continuous sparkler-style shimmer flanking the welcome message */
.welcome-row{display:flex;align-items:center;justify-content:flex-start;gap:6px;}
.sparkle-zone{position:relative;width:0;height:54px;flex:none;overflow:visible;transition:width .3s ease;}
.sparkle-zone.active{width:56px;}
.sparkle{position:absolute;
  clip-path:polygon(50% 0%,63% 38%,100% 50%,63% 62%,50% 100%,37% 62%,0% 50%,37% 38%);
  animation:sparkleTwinkle 1.3s ease-in-out infinite;}
@keyframes sparkleTwinkle{
  0%,100%{opacity:0;transform:scale(.25) rotate(0deg);}
  45%{opacity:1;transform:scale(1) rotate(45deg);}
  70%{opacity:.55;transform:scale(.7) rotate(60deg);}
}
@media (max-width:480px){ .sparkle-zone.active{width:34px;} }

/* ---------- RANKINGS TILE (pulsing purple glow) ---------- */
#leaderboardSection{grid-column:span 4;grid-row:span 2;display:flex;}
.lb-card{
  width:100%;display:flex;flex-direction:column;gap:14px;cursor:pointer;padding:22px 20px;
  animation:rise .45s ease both,lbBreath 3.5s ease-in-out infinite;
}
.lb-card::after{
  content:'';position:absolute;inset:0;border-radius:var(--r);pointer-events:none;padding:2px;
  background:linear-gradient(135deg,#6a00f4,#0d0d6b,#9c00e4,#1a0066,#7f00ff,#000080);background-size:300% 300%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  mask-composite:exclude;opacity:.85;animation:lbShift 4s ease-in-out infinite;
}
@keyframes lbShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
@keyframes lbBreath{
  0%,100%{box-shadow:var(--glass-shadow),var(--glass-inset),0 0 0 0 rgba(106,0,244,0);}
  50%{box-shadow:var(--glass-shadow),var(--glass-inset),0 0 30px 6px rgba(106,0,244,.30);}
}
.lb-card h2{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.4rem;}
.lb-card .lbmeta{color:var(--muted);font-weight:700;font-size:.84rem;margin-top:2px;}
.lb-prev{display:flex;flex-direction:column;gap:12px;}
.lbp h3{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.95rem;margin-bottom:6px;}
.lbp.q h3{color:var(--pink);} .lbp.k h3{color:#0aa8a8;}
.lbp ol{list-style:none;}
.lbp li{display:flex;align-items:center;gap:10px;padding:7px 10px;margin-bottom:5px;border-radius:12px;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);font-weight:800;font-size:.9rem;}
.lbp li .n{font-family:'Fredoka',sans-serif;font-weight:700;width:20px;text-align:center;flex:none;color:var(--muted);}
.lbp li .n.gold{color:#d4a017;} .lbp li .n.silver{color:#8a8a8a;} .lbp li .n.bronze{color:#b97b4a;}
.lbp li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lbp li .p{margin-left:auto;font-family:'Fredoka',sans-serif;font-weight:600;color:var(--muted);font-size:.85rem;flex:none;}
.lbp li.empty{color:var(--muted);font-weight:700;font-style:italic;}
/* Purple CTA pill */
.lb-cta-pill{margin-top:auto;font-family:'Fredoka',sans-serif;font-weight:700;font-size:.95rem;color:#fff;text-align:center;
  padding:13px 16px;background:linear-gradient(135deg,rgba(106,0,244,.92),rgba(0,0,120,.8));
  border:1px solid rgba(200,120,255,.6);border-radius:16px;letter-spacing:.03em;
  text-shadow:0 0 14px rgba(200,100,255,.8);box-shadow:0 8px 20px rgba(106,0,244,.25);
  animation:ctaPulse 2.2s ease-in-out infinite;}
@keyframes ctaPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}
.lb-pause-msg{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;
  color:var(--orange);text-align:center;padding:18px 0;line-height:1.5;animation:fadepulse 2s ease-in-out infinite;}
@keyframes fadepulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.lb-empty{color:var(--muted);font-weight:700;font-size:.92rem;padding:12px 0;font-style:italic;}

/* ---------- CATEGORY TILES ---------- */
.cat{grid-column:span 4;display:flex;flex-direction:column;cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease;}
.cat:not(.full):hover{transform:translateY(-3px);}
.cat.full{cursor:default;}
.cat.full .bar i{background:rgba(28,42,31,.28);}
.cat.is-locked,.cat.is-full{opacity:.86;}
.day{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.date{flex:none;width:54px;border-radius:14px;text-align:center;padding:6px 0 7px;
  background:rgba(255,255,255,.7);border:1px solid var(--glass-edge);box-shadow:var(--glass-inset);}
.date b{display:block;font-family:'Fredoka',sans-serif;font-size:1.25rem;line-height:1;}
.date span{font-size:.62rem;font-weight:800;letter-spacing:.1em;color:var(--ac);filter:brightness(.78);}
.cat-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.12rem;line-height:1.15;}
.time{color:var(--muted);font-weight:700;font-size:.85rem;margin-top:2px;}
.rule{display:inline-block;align-self:flex-start;margin:2px 0 14px;font-size:.74rem;font-weight:800;padding:5px 11px;
  border-radius:999px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge);}
.spots{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.spots .left{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.95rem;}
.spots .left b{font-size:1.45rem;}
.spots .left em{font-style:normal;color:var(--muted);font-weight:500;}
.bar{height:9px;border-radius:99px;background:rgba(28,42,31,.09);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 65%,#fff));}
.hurry{background:var(--pink);color:#fff;font-weight:800;font-size:.72rem;padding:5px 11px;border-radius:999px;
  box-shadow:0 6px 14px rgba(255,46,154,.35);animation:pulse 1.3s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.full-msg{margin-top:14px;text-align:center;font-weight:800;font-size:.88rem;color:var(--muted);
  padding:11px;border-radius:14px;background:rgba(255,255,255,.45);border:1px dashed rgba(28,42,31,.2);}
.cat-actions{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:10px;}
.reg-btn{width:100%;border:none;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:700;font-size:1rem;color:var(--ink);
  padding:12px 16px;border-radius:16px;background:linear-gradient(135deg,var(--lime),#c4ea3a);
  box-shadow:0 8px 18px rgba(139,184,0,.32),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .15s ease;}
.reg-btn:hover{transform:translateY(-1px);}
.who-btn{width:100%;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.82rem;letter-spacing:.03em;color:var(--ink);
  padding:10px;border-radius:14px;cursor:pointer;background:rgba(255,255,255,.55);border:1px solid var(--glass-edge);transition:all .15s ease;}
.who-btn:hover{background:rgba(255,255,255,.85);transform:translateY(-1px);}

/* bank details (each row copies on tap) */
.bank{margin:0 0 4px;padding:10px;border-radius:18px;background:rgba(255,255,255,.5);border:1px solid var(--glass-edge);cursor:default;}
.bank-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 4px 8px;}
.bank-h b{color:var(--ink);font-weight:700;text-transform:none;letter-spacing:0;font-size:.82rem;}
.bank-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  font-family:'Nunito',sans-serif;color:var(--ink);padding:8px 10px 8px 12px;margin-top:5px;border-radius:12px;
  background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.85);transition:background .15s ease,border-color .15s ease;}
.bank-row:first-of-type{margin-top:0;}
.bank-row:hover{background:#fff;}
.bank-row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.bank-row .bk{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.bank-row .bv{font-weight:800;font-size:.95rem;word-break:break-word;user-select:all;-webkit-user-select:all;}
.bank-row .bc{flex:none;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.74rem;padding:5px 11px;border-radius:999px;
  background:rgba(18,204,204,.16);color:#078a8a;border:1px solid rgba(18,204,204,.35);}
.bank-row.copied{background:rgba(168,214,0,.22);border-color:rgba(139,184,0,.5);}
.bank-row.copied .bc{background:var(--lime-deep);color:#fff;border-color:var(--lime-deep);}
.bank-row:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

/* ---------- FEATURED: closing soonest ---------- */
.feat{grid-column:span 8;display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:start;padding:26px 28px;cursor:default;}
.feat .tag{display:inline-flex;align-items:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.76rem;
  letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:999px;margin-bottom:12px;
  background:rgba(255,255,255,.6);border:1px solid var(--ac);
  background:color-mix(in srgb,var(--ac) 20%,rgba(255,255,255,.6));}
.feat .cat-name{font-size:1.65rem;margin-bottom:4px;}
.countdown{display:flex;gap:8px;margin:16px 0 8px;}
.cd{min-width:64px;text-align:center;padding:9px 6px 8px;border-radius:16px;background:rgba(255,255,255,.65);border:1px solid var(--glass-edge);}
.cd b{display:block;font-family:'Fredoka',sans-serif;font-size:1.5rem;line-height:1;}
.cd span{font-size:.62rem;font-weight:800;letter-spacing:.1em;color:var(--muted);}
.feat .note{color:var(--muted);font-weight:700;font-size:.82rem;}
.feat .col-r{display:flex;flex-direction:column;}
.feat .col-r .cat-actions{padding-top:12px;}

/* ---------- TIER STRIP ---------- */
.rules{grid-column:span 12;display:grid;grid-template-columns:210px repeat(3,minmax(0,1fr));gap:16px;align-items:stretch;}
.rules h2{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.25rem;line-height:1.15;align-self:center;}
.rules h2 small{display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:.8rem;color:var(--muted);margin-top:6px;}
.tier{padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.55);border:1px solid var(--glass-edge);}
.tier b{font-family:'Fredoka',sans-serif;font-size:1rem;display:flex;align-items:center;gap:8px;}
.tier b i{width:10px;height:10px;border-radius:50%;background:var(--ac);display:inline-block;}
.tier p{font-weight:700;font-size:.84rem;color:var(--muted);margin-top:4px;line-height:1.35;}
.tier[data-accent=lime]{--ac:var(--lime-deep);}
.tier[data-accent=orange]{--ac:var(--orange);}
.tier[data-accent=cyan]{--ac:var(--cyan);}
.tier[data-accent=pink]{--ac:var(--pink);}
.tier::before{display:none !important;}

/* idle / error messages */
.wide{grid-column:1/-1;}
.idle-block{text-align:center;padding:36px 28px;}
.idle-block h2{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.5rem;color:var(--ink);margin-bottom:12px;}
.idle-block p{color:var(--muted);font-weight:600;font-size:.95rem;line-height:1.6;max-width:480px;margin:0 auto 20px;}
.idle-dnl-note{background:rgba(255,255,255,.55);border:1px solid var(--glass-edge);border-radius:var(--r-sm);
  padding:16px 20px;font-weight:600;font-size:.9rem;color:var(--ink);line-height:1.6;max-width:480px;margin:0 auto;}
.idle-dnl-note b{color:var(--pink);}
.msg-tile .full-msg{margin-top:0;}

/* ---------- BOTTOM DRAWERS (frosted sheets) ---------- */
.lb-drawer-overlay{position:fixed;inset:0;background:rgba(28,42,31,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:98;opacity:0;pointer-events:none;transition:opacity .35s ease;}
.lb-drawer-overlay.show{opacity:1;pointer-events:auto;}
.lb-drawer{position:fixed;bottom:0;left:0;right:0;z-index:99;margin:0 auto;max-width:720px;
  background:rgba(244,248,243,.82);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid var(--glass-edge);border-bottom:none;border-radius:28px 28px 0 0;
  box-shadow:0 -10px 50px rgba(60,80,55,.22),var(--glass-inset);
  max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(102%);visibility:hidden;transition:transform .4s cubic-bezier(.25,.8,.25,1),visibility 0s linear .4s;}
.lb-drawer.open{transform:translateY(0);visibility:visible;transition:transform .4s cubic-bezier(.25,.8,.25,1),visibility 0s;}
.lb-drawer-handle-bar{width:50px;height:5px;border-radius:3px;background:rgba(28,42,31,.18);margin:14px auto 2px;flex-shrink:0;}
.lb-drawer-topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 12px;flex-shrink:0;
  border-bottom:1px solid rgba(28,42,31,.08);}
.lb-drawer-title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.25rem;}
.lb-drawer-close,.wp-reload{border:1px solid var(--glass-edge);background:rgba(255,255,255,.7);border-radius:12px;padding:7px 13px;cursor:pointer;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:.9rem;color:var(--ink);}
.lb-drawer-close{color:var(--muted);}
.lb-drawer-close:hover,.wp-reload:hover{background:#fff;}
.lb-drawer-body{overflow-y:auto;padding:18px 20px 40px;flex:1;-webkit-overflow-scrolling:touch;}
.lb-drawer-body .lb-cols{grid-template-columns:1fr;}
.lb-drawer-body .lb-col h3{font-size:1.1rem;margin-top:8px;}
.wp-topbar-right{display:flex;align-items:center;gap:8px;}
.wp-reload{font-size:.85rem;color:var(--ink);display:flex;align-items:center;gap:5px;}
.wp-reload.spin .wp-reload-icon{animation:wpSpin .6s linear;}
@keyframes wpSpin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
.wp-slotcount{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.9rem;color:var(--muted);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(28,42,31,.1);}
.wp-list{list-style:none;}
.wp-list li{padding:11px 4px;border-bottom:1px solid rgba(28,42,31,.08);font-weight:700;font-size:.95rem;}
.wp-list li:last-child{border-bottom:none;}
.wp-list li .wp-num{color:var(--lime-deep);font-family:'Fredoka',sans-serif;font-weight:600;margin-right:8px;}
/* drawer rankings list */
.lb-search-wrap{padding-bottom:14px;}
.lb-search{width:100%;font-family:'Nunito',sans-serif;font-weight:700;font-size:.95rem;color:var(--ink);padding:12px 14px;
  border:1px solid var(--glass-edge);border-radius:var(--r-sm);background:rgba(255,255,255,.7);box-shadow:inset 0 1px 3px rgba(60,80,55,.12);outline:none;}
.lb-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.lb-col h3{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid rgba(28,42,31,.08);}
.lb-col h3.girls{color:var(--pink);}.lb-col h3.boys{color:#0aa8a8;}
.lb-list{list-style:none;}
.lb-list li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(28,42,31,.07);font-weight:700;font-size:.95rem;}
.lb-list li:last-child{border-bottom:none;}
.lb-rank{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--muted);min-width:26px;text-align:right;font-size:.85rem;}
.lb-rank.gold{color:#d4a017;}.lb-rank.silver{color:#8a8a8a;}.lb-rank.bronze{color:#b97b4a;}

<script>
/* ============================================================
   PASTE YOUR APPS SCRIPT /exec URL HERE
   ============================================================ */
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzeZaUXvfqsA1oVqwwnSxdn_JJrYnCJQ5-3vA0-TCJSjMZUP2tRMEl-PawqlxZ5opGbXg/exec";

/* ============================================================
   FIREWORKS — Week 21 only (National Pickleball Day celebration).
   Continuous, full-page, brand-colored particle bursts behind all
   content. Auto-expires the moment WEEK !== 21 — nothing to turn
   off manually next week. Respects prefers-reduced-motion and
   pauses when the browser tab isn't visible (saves battery/CPU).
   ============================================================ */
const FIREWORK_COLORS = ['#a8d600','#ff2e9a','#12cccc','#ff8f00','#8bb800'];
let fwCanvas=null, fwCtx=null, fwParticles=[], fwRunning=false, fwLaunchTimer=null;

function initFireworks(){
  fwCanvas=document.getElementById('fireworksCanvas');
  if(!fwCanvas) return;
  fwCtx=fwCanvas.getContext('2d');
  resizeFireworksCanvas();
  window.addEventListener('resize', resizeFireworksCanvas);
  fwCanvas.style.display='block';

  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(prefersReducedMotion){
    // Accessibility: a couple of gentle static bursts, no continuous animation
    launchFirework(); setTimeout(launchFirework,600);
    return;
  }

  fwRunning=true;
  scheduleNextLaunch();
  requestAnimationFrame(fireworksLoop);

  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){
      fwRunning=false;
      if(fwLaunchTimer) clearTimeout(fwLaunchTimer);
    }else if(!fwRunning){
      fwRunning=true;
      scheduleNextLaunch();
      requestAnimationFrame(fireworksLoop);
    }
  });
}

function resizeFireworksCanvas(){
  if(!fwCanvas) return;
  fwCanvas.width=window.innerWidth;
  fwCanvas.height=window.innerHeight;
}

function scheduleNextLaunch(){
  if(!fwRunning) return;
  const delay=350+Math.random()*550; // more active — frequent, overlapping bursts
  fwLaunchTimer=setTimeout(()=>{ launchFirework(); scheduleNextLaunch(); }, delay);
}

function launchFirework(){
  if(!fwCanvas) return;
  const x=fwCanvas.width*(0.15+Math.random()*0.7);
  const y=fwCanvas.height*(0.2+Math.random()*0.35);
  const color=FIREWORK_COLORS[Math.floor(Math.random()*FIREWORK_COLORS.length)];
  const count=45+Math.floor(Math.random()*25);
  for(let i=0;i<count;i++){
    const angle=(Math.PI*2*i)/count+Math.random()*0.2;
    const speed=2+Math.random()*3.2;
    fwParticles.push({
      x,y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
      life:1, decay:0.010+Math.random()*0.012, color, size:1.6+Math.random()*1.6,
    });
  }
}

function fireworksLoop(){
  if(!fwRunning) return;
  fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height);
  for(let i=fwParticles.length-1;i>=0;i--){
    const p=fwParticles[i];
    p.vy+=0.045; // gravity
    p.x+=p.vx; p.y+=p.vy;
    p.life-=p.decay;
    if(p.life<=0){ fwParticles.splice(i,1); continue; }
    fwCtx.globalAlpha=Math.max(p.life,0);
    fwCtx.fillStyle=p.color;
    fwCtx.beginPath();
    fwCtx.arc(p.x,p.y,p.size,0,Math.PI*2);
    fwCtx.fill();
  }
  fwCtx.globalAlpha=1;
  requestAnimationFrame(fireworksLoop);
}

// Continuous sparkler-style shimmer flanking the welcome message — smaller,
// gentler, and always-on, distinct from the big periodic fireworks bursts.
function initBottleSparkles(){
  const left=document.getElementById('sparkleLeft');
  const right=document.getElementById('sparkleRight');
  if(!left||!right) return;
  left.classList.add('active');
  right.classList.add('active');
  [left,right].forEach(zone=>{
    for(let i=0;i<5;i++){
      const s=document.createElement('div');
      s.className='sparkle';
      const size=5+Math.random()*7;
      const color=FIREWORK_COLORS[Math.floor(Math.random()*FIREWORK_COLORS.length)];
      s.style.width=size+'px';
      s.style.height=size+'px';
      s.style.left=(10+Math.random()*70)+'%';
      s.style.top=(10+Math.random()*70)+'%';
      s.style.background=color;
      s.style.boxShadow='0 0 6px 1px '+color;
      s.style.animationDelay=(Math.random()*1.3)+'s';
      zone.appendChild(s);
    }
  });
}

/* ============================================================
   PAYMENT DETAILS — shown (tap-to-copy) inside every open event
   card and on the registration form. Edit here only.
   ============================================================ */
const BANK_DETAILS = [
  {label:'Account no', value:'188020015041'},
  {label:'Name',       value:'A N Jayakody'},
  {label:'Bank',       value:'Hatton National Bank'},
];
const ENTRY_FEE_LABEL = '2,500 LKR pp';

function esc(t){
  return String(t==null?'':t).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function bankBlockHtml(){
  const rows = BANK_DETAILS.map(r=>
    `<button type="button" class="bank-row" data-copy="${esc(r.value)}" onclick="copyBank(event,this)" aria-label="Copy ${esc(r.label)}">
       <span class="txt"><span class="bk">${esc(r.label)}</span><span class="bv">${esc(r.value)}</span></span><span class="bc">Copy</span>
     </button>`).join('');
  return `<div class="bank" onclick="event.stopPropagation()">
    <div class="bank-h"><span>Pay by bank transfer</span><b>${esc(ENTRY_FEE_LABEL)}</b></div>${rows}</div>`;
}
function legacyCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text; ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:0;opacity:0;';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,text.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  return ok;
}
function copyBank(ev,btn){
  ev.stopPropagation(); ev.preventDefault(); // never let a copy tap open the registration form
  const text=btn.getAttribute('data-copy')||'';
  const done=()=>{
    const chip=btn.querySelector('.bc');
    btn.classList.add('copied'); if(chip) chip.textContent='Copied';
    clearTimeout(btn._t);
    btn._t=setTimeout(()=>{ btn.classList.remove('copied'); if(chip) chip.textContent='Copy'; },1600);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>{ if(legacyCopy(text)) done(); });
  }else if(legacyCopy(text)){ done(); }
}

/* ---- "closing soonest" countdown ---- */
let _cdTimer=null;
function tickCountdown(){
  const el=document.getElementById('featCountdown');
  if(!el){ clearInterval(_cdTimer); _cdTimer=null; return; }
  const ms=new Date(el.dataset.lock).getTime()-Date.now();
  if(ms<=0){ clearInterval(_cdTimer); _cdTimer=null; renderCards(); return; } // it just locked — refresh the tiles
  const sec=Math.floor(ms/1000), d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60), x=sec%60;
  const cells = d>0 ? [[d,'DAYS'],[h,'HRS'],[m,'MIN']] : [[h,'HRS'],[m,'MIN'],[x,'SEC']];
  el.innerHTML = cells.map(c=>`<div class="cd"><b>${String(c[0]).padStart(2,'0')}</b><span>${c[1]}</span></div>`).join('');
}

/* ---- week anchor (fallback only, for the leaderboard's week-number
   display before loadSlots() resolves — actual schedule now comes
   entirely from the backend, see loadSlots()/renderCards() below) ---- */
const WEEK14_START = new Date(2026, 5, 13); // Sat 13 Jun 2026

let WEEK = 14;

// Computes the current DUPR week directly from the clock.
// Used by the leaderboard subtitle so it's accurate even when
// loadLeaderboard() resolves before loadSlots() sets WEEK.
function lbWeek(){
  return 14+Math.floor((Date.now()-WEEK14_START.getTime())/(7*24*60*60*1000));
}

/* ---- season labeling — mirrors Code.gs's SEASON_BOUNDARIES exactly.
   Only used as a fast fallback before the backend response arrives
   (which also sends season/seasonWeek directly); keep these two tables
   in sync whenever a new season is added. ---- */
const SEASON_BOUNDARIES = [
  {season:1, startWeek:1},
  {season:2, startWeek:14},
  {season:3, startWeek:29},
];
function getSeasonInfo(weekNum){
  let cur=SEASON_BOUNDARIES[0];
  for(const b of SEASON_BOUNDARIES){ if(weekNum>=b.startWeek) cur=b; else break; }
  return {season:cur.season, seasonWeek:weekNum-cur.startWeek+1};
}
// Season 1/2 weeks intentionally keep showing as plain "Week N" — only
// Season 3 onward gets the "Season N, Week M" treatment.
function weekLabelFor(weekNum){
  const s=getSeasonInfo(weekNum);
  return s.season>=3 ? ('Season '+s.season+', Week '+s.seasonWeek) : ('Week '+weekNum);
}
function updateEyebrow(weekNum){
  const s=getSeasonInfo(weekNum);
  const el=document.getElementById('eyebrow');
  if(el) el.textContent='DUPR Nights, Season '+s.season;
}
let slots = {categories:{}}; // full response from the backend (schedule + capacity, per category)
let current = null;
const form = {};
let PLAYER_DIRECTORY = []; // {name, gender} from Points - Overall, for name autocomplete

/* ---- schedule/lock helpers — everything now comes from the backend,
   including the actual calendar date, display time, and lock cutoff,
   so a Clock/Calendar change made on Website 2 shows up here with no
   client-side schedule logic of its own to keep in sync. ---- */
function isLocked(cat){ return Date.now() >= new Date(cat.lockAt).getTime(); }

// An event is considered "done" once its calendar day has fully passed
// (i.e. from midnight the following day) — used to switch the
// "SEE WHO IS PLAYING" button to "SEE WHO PLAYED".
function isEventDone(cat){
  if(!slots.weekStartDate) return false;
  const d = new Date(slots.weekStartDate);
  d.setDate(d.getDate() + cat.day + 1); // start of the day AFTER the event
  d.setHours(0,0,0,0);
  return Date.now() >= d.getTime();
}
// Short day abbreviation for card display, e.g. "monday" -> "Mon"
function dayAbbrev(dayName){ return dayName ? (dayName.charAt(0).toUpperCase()+dayName.slice(1,3)) : ''; }
// Reconstructs a human-readable tier rule string from raw tier fields
// (the backend sends the raw values, not a pre-formatted label).
function ruleText(cat){
  if(cat.tierMin!=null && cat.tierMax!=null)
    return 'DUPR '+Number(cat.tierMin).toFixed(3)+(cat.tierStrictMax?' to below ':' to ')+Number(cat.tierMax).toFixed(3);
  if(cat.tierMax!=null && cat.tierMin==null)
    return cat.tierStrictMax ? ('DUPR below '+Number(cat.tierMax).toFixed(3)) : ('DUPR '+Number(cat.tierMax).toFixed(3)+' & below');
  if(cat.tierMin!=null && cat.tierMax==null)
    return 'DUPR '+Number(cat.tierMin).toFixed(3)+' & above';
  return 'Open to all';
}
// Sensible DUPR placeholder example derived from the tier rule, since
// this is no longer hardcoded per category.
function exampleDupr(cat){
  if(cat.tierMax!=null) return (Number(cat.tierMax)-0.3).toFixed(3);
  if(cat.tierMin!=null) return (Number(cat.tierMin)+0.2).toFixed(3);
  return '3.000';
}

/* ---- load slot counts + leaderboard on open ---- */
async function loadSlots(){
  // PERF: 10-second timeout on initial load
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 10000);
  try{
    const res = await fetch(BACKEND_URL, {signal: ctrl.signal});
    clearTimeout(timer);
    const data = await res.json();
    WEEK = data.week;
    slots = data;

    const seasonInfo = (data.season!=null) ? {season:data.season, seasonWeek:data.seasonWeek} : getSeasonInfo(WEEK);
    updateEyebrow(WEEK);

    if(data.registrationOpen===false){
      renderHeroChips(data);

/* Hero chips: registration status, the week's date range, event count */
function renderHeroChips(data){
  const el=document.getElementById('heroChips'); if(!el) return;
  const open = data.registrationOpen!==false;
  let html = `<span class="chip"><span class="dot${open?'':' off'}"></span>${open?'Registration open':'Registration closed'}</span>`;
  if(open && data.weekStartDate){
    const start=new Date(data.weekStartDate);
    if(!isNaN(start.getTime())){
      const end=new Date(start.getTime()+6*86400000);
      const f=d=>d.toLocaleDateString('en-GB',{timeZone:'Asia/Colombo',weekday:'short',day:'numeric',month:'short'});
      html += `<span class="chip">${f(start)} – ${f(end)}</span>`;
    }
    const n=Object.keys(data.categories||{}).length;
    if(n) html += `<span class="chip">${n} event${n===1?'':'s'} this week</span>`;
  }
  el.innerHTML=html;
}

/* ---- render category cards ----
   Fully data-driven from the backend — a category (like ACTION BEE
   Singles) simply appears the week it's active, and any Clock/Calendar
   change made on Website 2 shows up here automatically, with zero
   category-specific code needed on this page. ---- */
function renderCards(){
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  if(_cdTimer){ clearInterval(_cdTimer); _cdTimer=null; }
  const cats = slots.categories||{};
  // Chronological order (day, then time) — meaningful now that any
  // category's day/time can be individually rescheduled by the admin.
  const keys = Object.keys(cats).sort((a,b)=>{
    const ca=cats[a], cb=cats[b];
    if(ca.day!==cb.day) return ca.day-cb.day;
    return (ca.startMin||0)-(cb.startMin||0);
  });

  // "Closing soonest": the open, not-full event whose registration locks first.
  let featKey=null, featLock=Infinity;
  keys.forEach(k=>{
    const c=cats[k], t=new Date(c.lockAt).getTime();
    if(!isLocked(c) && c.left>0 && isFinite(t) && t<featLock){ featLock=t; featKey=k; }
  });

  const spotsLine=(c,withTotal)=>`<div class="spots">
      <div class="left"><b>${c.left}</b> ${withTotal?('<em>of '+c.limit+'</em> '):''}${c.left===1?'spot':'spots'} left</div>
      ${(c.left<=3)?'<div class="hurry">Hurry! Only '+c.left+' left</div>':''}
    </div>
    <div class="bar"><i style="width:${c.limit>0?Math.min(100,Math.round((c.limit-c.left)/c.limit*100)):0}%"></i></div>`;
  const whoBtn=(key,c)=>`<button class="who-btn" onclick="event.stopPropagation();openWhoPlaying('${key}')">${isEventDone(c) ? 'SEE WHO PLAYED' : 'SEE WHO IS PLAYING'}</button>`;

  // ---- featured tile ----
  if(featKey){
    const c=cats[featKey];
    const tile=document.createElement('div');
    tile.className='tile feat';
    tile.setAttribute('data-accent',c.accent);
    tile.innerHTML=`
      <div>
        <div class="tag">Closing soonest</div>
        <div class="cat-name">${esc(c.label)}</div>
        <div class="time">${dayAbbrev(c.dayName)} · ${esc(c.date)} · ${esc(c.time)}</div>
        <div class="countdown" id="featCountdown" data-lock="${esc(c.lockAt)}"></div>
        <div class="note">Registration locks 90 minutes before start</div>
      </div>
      <div class="col-r">
        <div class="rule">${esc(ruleText(c))}</div>
        ${spotsLine(c,true)}
        <div class="cat-actions">
          <button class="reg-btn" onclick="openForm('${featKey}')">Register now</button>
          ${whoBtn(featKey,c)}
        </div>
      </div>`;
    grid.appendChild(tile);
    tickCountdown();
    _cdTimer=setInterval(tickCountdown,1000);
  }

  // ---- standard tiles ----
  keys.forEach(key=>{
    if(key===featKey) return;
    const c = cats[key];
    const left = c.left;
    const locked = isLocked(c);
    const full = left <= 0;
    const card = document.createElement('div');
    card.className = 'tile cat' + (locked ? ' full is-locked' : full ? ' full is-full' : '');
    card.setAttribute('data-accent', c.accent);
    const dayNum = parseInt(c.date,10);
    card.innerHTML = `
      <div class="day">
        <div class="date"><b>${isNaN(dayNum)?'':dayNum}</b><span>${dayAbbrev(c.dayName).toUpperCase()}</span></div>
        <div><div class="cat-name">${esc(c.label)}</div><div class="time">${esc(c.time)}</div></div>
      </div>
      <div class="rule">${esc(ruleText(c))}</div>
      ${locked ? '<div class="full-msg">See you next week!</div>'
        : full ? '<div class="full-msg">Sorry, no slots left! see you next week!</div>'
        : spotsLine(c,false)}
      <div class="cat-actions">
        ${(locked||full) ? '' : `<button class="reg-btn" onclick="event.stopPropagation();openForm('${key}')">Register</button>`}
        ${whoBtn(key,c)}
      </div>`;
    if(!full && !locked) card.onclick = ()=>openForm(key);
    grid.appendChild(card);
  });

  // ---- tier strip (derived from live tier rules) ----
  const tiers=[['New Bee','newbee_','lime'],['Action Bee','action_','orange'],['Stinger Bee','stinger_','cyan']]
    .map(t=>{ const k=keys.find(x=>x.indexOf(t[1])===0); return k?{name:t[0],accent:t[2],rule:ruleText(cats[k])}:null; })
    .filter(Boolean);
  if(tiers.length){
    const strip=document.createElement('div');
    strip.className='tile rules';
    strip.innerHTML=`<h2>Which Bee are you?<small>Play in your tier, or step up to a higher one.</small></h2>`
      + tiers.map(t=>`<div class="tier" data-accent="${t.accent}"><b><i></i>${esc(t.name)}</b><p>${esc(t.rule)}</p></div>`).join('');
    grid.appendChild(strip);
  }
}

/* ── Leaderboard nav bar JS ── */

function renderLeaderboard(data){
  const sec = document.getElementById('leaderboardSection');
  const wk  = lbWeek();
  let cardInner, drawerContent;

  if(data && data.paused){
    cardInner = `<div class="lb-pause-msg">Please hang tight, we are currently updating your rankings!</div>`;
    drawerContent = cardInner;
  } else if(!data || (!data.girls.length && !data.boys.length)){
    cardInner = `<div class="lb-empty">Rankings will appear once the season gets underway.</div>`;
    drawerContent = cardInner;
  } else {
    const ri = n => n===1?'gold':n===2?'silver':n===3?'bronze':'';
    const gc = data.girlsCutoff||12, bc = data.boysCutoff||36;

    // Build a section list with rank, name, points and a separator at the cutoff
    const buildList = (players, cutoff) => {
      if(!players.length) return '<div class="lb-empty">No rankings yet.</div>';
      const items = players.map((p,i)=>{
        const sep = i===cutoff ? '<li class="lb-sep" aria-hidden="true"></li>' : '';
        return sep+`<li data-name="${p.name.toLowerCase()}">
          <span class="lb-rank ${ri(i+1)}">${i+1}</span>
          <span class="lb-name">${p.name}</span>
          <span class="lb-pts">${p.points}</span>
        </li>`;
      }).join('');
      return `<ul class="lb-list">${items}</ul>`;
    };

    const rankingsHtml = `<div class="lb-cols">
      <div class="lb-col"><h3 class="girls">Queens</h3>${buildList(data.girls,gc)}</div>
      <div class="lb-col"><h3 class="boys">Kings</h3>${buildList(data.boys,bc)}</div>
    </div>`;
    const top3 = (arr)=> (arr&&arr.length)
      ? arr.slice(0,5).map((p,i)=>`<li><span class="n ${ri(i+1)}">${i+1}</span><span class="nm">${esc(p.name)}</span><span class="p">${esc(p.points)}</span></li>`).join('')
      : '<li class="empty">No rankings yet</li>';
    cardInner    = `<div class="lb-prev">
        <div class="lbp q"><h3>Queens</h3><ol>${top3(data.girls)}</ol></div>
        <div class="lbp k"><h3>Kings</h3><ol>${top3(data.boys)}</ol></div>
      </div>
      <div class="lb-cta-pill">CLICK HERE TO VIEW YOUR RANK!</div>`;
    drawerContent = `<div class="lb-search-wrap">
      <input class="lb-search" type="text" placeholder="Search your name…" oninput="filterLbSearch(this.value)">
    </div>${rankingsHtml}`;
  }

  const wkLabel = weekLabelFor(wk);
  sec.innerHTML = `<div class="lb-card tile" onclick="openLbDrawer()">
    <div><h2>HIVE Rankings</h2>
    <div class="lbmeta">Standings as of ${wkLabel}</div></div>
    ${cardInner}
  </div>`;

  const db = document.getElementById('lbDrawerBody');
  if(db) db.innerHTML = `<div style="margin-bottom:14px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.1rem;">Standings as of ${wkLabel}</div>${drawerContent}`;
}


function openLbDrawer(){
  closeWpDrawer(); // never let both drawers stack
  document.getElementById('lbDrawer').classList.add('open');
  document.getElementById('lbDrawerOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
  // Swipe-down to close
  const drawer = document.getElementById('lbDrawer');
  let _ty = 0;
  drawer._tsStart = e => { _ty = e.touches[0].clientY; };
  drawer._tsEnd = e => { if(e.changedTouches[0].clientY - _ty > 70) closeLbDrawer(); };
  drawer.addEventListener('touchstart', drawer._tsStart, {passive:true});
  drawer.addEventListener('touchend', drawer._tsEnd, {passive:true});
}
function closeLbDrawer(){
  const drawer = document.getElementById('lbDrawer');
  drawer.classList.remove('open');
  document.getElementById('lbDrawerOverlay').classList.remove('show');
  document.body.style.overflow = '';
  drawer.removeEventListener('touchstart', drawer._tsStart);
  drawer.removeEventListener('touchend', drawer._tsEnd);
}

/* ---- field handlers ---- */
function setVal(k,v){ form[k]=v; validate(); }
function pick(btn,k,v){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel'); form[k]=v; validate();
}
// Toggles between "DUPR ID" input and "email" input (per DUPR's own
// recommended process for players who don't have an account yet — the
// club can invite them by email, which auto-creates their account and
// lets us log matches for them immediately).
function toggleDuprIdMode(who,checked){
  const idInput=document.getElementById(who==='main'?'duprIdInput':'partnerDuprIdInput');
  const emailInput=document.getElementById(who==='main'?'duprEmailInput':'partnerDuprEmailInput');
  const idKey=who==='main'?'duprId':'partnerDuprId';
  const emailKey=who==='main'?'duprEmail':'partnerDuprEmail';
  if(checked){
    idInput.style.display='none'; idInput.value=''; form[idKey]='';
    emailInput.style.display='block';
  }else{
    idInput.style.display='block';
    emailInput.style.display='none'; emailInput.value=''; form[emailKey]='';
  }
  validate();
}
function pickFile(input){
  const f=input.files[0]; if(!f) return;
  form._file=f;
  document.getElementById('fileLabel').textContent=f.name;
  document.getElementById('fileBtn').classList.add('has');
  validate();
}
function enterNext(event,el){
  if(event.key!=='Enter') return; event.preventDefault();
  const inputs=Array.from(document.querySelectorAll('#formFields input[type=text],#formFields input[type=number]'));
  const i=inputs.indexOf(el);
  if(i>-1&&i<inputs.length-1)inputs[i+1].focus(); else el.blur();
}

/* ============================================================
   NAME AUTOCOMPLETE — suggests names already in the season's
   player directory (Points - Overall) to reduce typo-driven
   duplicate entries that fragment a player's points.
   ============================================================ */
async function loadPlayerDirectory(){
  try{
    const res=await fetch(BACKEND_URL+'?action=playerDirectory');
    const data=await res.json();
    if(data&&data.ok&&Array.isArray(data.players)) PLAYER_DIRECTORY=data.players;
  }catch(e){ /* silent — autocomplete is a convenience, not a requirement */ }
}

// field: 'name' or 'partnerName'
const _acActiveIndex={name:-1,partnerName:-1};

function acMatches(query){
  const q=query.trim().toLowerCase();
  if(!q) return [];
  const starts=[], contains=[];
  PLAYER_DIRECTORY.forEach(p=>{
    const n=p.name.toLowerCase();
    if(n.startsWith(q)) starts.push(p);
    else if(n.includes(q)) contains.push(p);
  });
  // Prefix matches first, then substring matches, capped at 6 results
  return starts.concat(contains).slice(0,6);
}

function acShow(field,query){
  const list=document.getElementById('acList-'+field);
  if(!list) return;
  const matches=acMatches(query);
  _acActiveIndex[field]=-1;
  if(matches.length===0){ list.classList.remove('show'); list.innerHTML=''; return; }
  list.innerHTML=matches.map((p,i)=>
    `<div class="ac-item" data-i="${i}" onmousedown="acSelect('${field}',${i})">
       <span>${p.name}</span><span class="ac-g ${p.gender}">${p.gender}</span>
     </div>`).join('');
  list._matches=matches;
  list.classList.add('show');
}

function acHideDelayed(field){
  // Delay so a click on an item (onmousedown) registers before the dropdown vanishes
  setTimeout(()=>{
    const list=document.getElementById('acList-'+field);
    if(list) list.classList.remove('show');
  },150);
}

function acSelect(field,index){
  const list=document.getElementById('acList-'+field);
  const p=list&&list._matches&&list._matches[index];
  if(!p) return;
  const inputId=field==='name'?'nameInput':'partnerNameInput';
  const input=document.getElementById(inputId);
  if(input) input.value=p.name;
  setVal(field,p.name);

  // Auto-fill gender (still editable — just pre-selects the toggle)
  const genderKey=field==='name'?'gender':'partnerGender';
  const segId=field==='name'?'segGender':'segPartnerGender';
  const seg=document.getElementById(segId);
  if(seg){
    const btn=Array.from(seg.querySelectorAll('button'))
      .find(b=>b.getAttribute('onclick').includes(`'${p.gender}'`));
    if(btn) pick(btn,genderKey,p.gender);
  }

  // Auto-fill DUPR ID (or switch to email mode) from what was remembered
  // the last time this player registered — still fully editable.
  const who=field==='name'?'main':'partner';
  applyRememberedDuprIdentity(who,p.duprIdentity||'');

  list.classList.remove('show');
}

// Fills in the DUPR ID/email fields from a remembered identity string —
// either a raw DUPR ID, or "email:xxx" if they registered without one
// last time. Always editable afterward; this is just a starting suggestion.
function applyRememberedDuprIdentity(who,identity){
  const idInput=document.getElementById(who==='main'?'duprIdInput':'partnerDuprIdInput');
  const emailInput=document.getElementById(who==='main'?'duprEmailInput':'partnerDuprEmailInput');
  const toggle=document.getElementById(who==='main'?'noDuprIdToggle':'noPartnerDuprIdToggle');
  const idKey=who==='main'?'duprId':'partnerDuprId';
  const emailKey=who==='main'?'duprEmail':'partnerDuprEmail';
  if(!identity) return; // nothing remembered — leave fields as the admin left them
  if(identity.indexOf('email:')===0){
    const email=identity.slice(6);
    if(toggle) toggle.checked=true;
    if(idInput){ idInput.style.display='none'; idInput.value=''; form[idKey]=''; }
    if(emailInput){ emailInput.style.display='block'; emailInput.value=email; form[emailKey]=email; }
  }else{
    if(toggle) toggle.checked=false;
    if(idInput){ idInput.style.display='block'; idInput.value=identity; form[idKey]=identity; }
    if(emailInput){ emailInput.style.display='none'; emailInput.value=''; form[emailKey]=''; }
  }
  validate();
}

// Keyboard navigation: Up/Down to move through suggestions, Enter to select
function acKeyNav(event,field){
  const list=document.getElementById('acList-'+field);
  const open=list&&list.classList.contains('show');
  if(!open){ enterNext(event,event.target); return; }

  const items=Array.from(list.querySelectorAll('.ac-item'));
  if(event.key==='ArrowDown'){
    event.preventDefault();
    _acActiveIndex[field]=Math.min(_acActiveIndex[field]+1,items.length-1);
    items.forEach((it,i)=>it.classList.toggle('active',i===_acActiveIndex[field]));
  }else if(event.key==='ArrowUp'){
    event.preventDefault();
    _acActiveIndex[field]=Math.max(_acActiveIndex[field]-1,0);
    items.forEach((it,i)=>it.classList.toggle('active',i===_acActiveIndex[field]));
  }else if(event.key==='Enter'){
    if(_acActiveIndex[field]>-1){
      event.preventDefault();
      acSelect(field,_acActiveIndex[field]);
    }else{
      list.classList.remove('show');
      enterNext(event,event.target);
    }
  }else if(event.key==='Escape'){
    list.classList.remove('show');
  }
}

/* ---- live validation ---- */
function validate(){
  const c=(slots.categories||{})[current]; if(!c) return;
  const btn=document.getElementById('submitBtn');
  const errEl=document.getElementById('tierErr');
  errEl.classList.remove('show');
  let ok=form.name&&form.dupr&&form.gender&&form._file;
  if(c.type!=='singles') ok=ok&&form.partnerName&&form.partnerGender&&(form.payBoth!==undefined);

  // DUPR ID (or fallback email) required for every player
  ok = ok && !!(form.duprId||form.duprEmail);
  if(c.type!=='singles') ok = ok && !!(form.partnerDuprId||form.partnerDuprEmail);

  // DUPR tier block (tierStrictMax = strictly below tierMax)
  const r=parseFloat(form.dupr);
  if(form.dupr&&!isNaN(r)){
    if(c.tierMax!=null){
      const blocked=c.tierStrictMax?(r>=c.tierMax):(r>c.tierMax);
      if(blocked){
        errEl.textContent=c.tierStrictMax
          ?'This category requires DUPR below '+c.tierMax+'. Yours is '+r+'.'
          :'This category is for DUPR '+c.tierMax+' & below. Yours is '+r+'.';
        errEl.classList.add('show'); ok=false;
      }
    }
    if(c.tierMin!=null&&r<c.tierMin){
      errEl.textContent='This category is for DUPR '+c.tierMin+' & above. Yours is '+r+'.';
      errEl.classList.add('show'); ok=false;
    }
  }
  btn.disabled=!ok;
}

/* ============================================================
   PERF: Image compression before base64 encoding.
   Images → max 1200px, 80% JPEG quality (~100-300KB).
   PDFs → passed through unchanged.
   ============================================================ */
async function compressImage(file){
  if(!file.type.startsWith('image/')) return file; // PDFs pass through
  return new Promise((res)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const MAX=1200, scale=Math.min(1,MAX/img.width);
        const canvas=document.createElement('canvas');
        canvas.width=Math.round(img.width*scale);
        canvas.height=Math.round(img.height*scale);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob=>{
          if(!blob){res(file);return;}
          res(new File([blob],file.name.replace(/\.[^.]+$/,'.jpg'),{type:'image/jpeg'}));
        },'image/jpeg',0.80);
      }catch(e){URL.revokeObjectURL(url);res(file);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(file);};
    img.src=url;
  });
}

/* ---- submit ---- */
async function submitEntry(){
  const btn=document.getElementById('submitBtn');
  // PERF: submit guard — disable immediately, show compression message
  btn.disabled=true;
  btn.textContent='Preparing your slip...';

  let file=form._file;
  try{ file=await compressImage(file); }catch(e){ /* fallback to original */ }

  showOverlay();
  const base64=await fileToBase64(file);

  const payload={
    category:current, name:form.name, dupr:form.dupr, gender:form.gender,
    duprId:form.duprId||'', duprEmail:form.duprEmail||'',
    partnerName:form.partnerName||'', partnerGender:form.partnerGender||'',
    partnerDupr:form.partnerDupr||'', payingForBoth:form.payBoth===true,
    partnerDuprId:form.partnerDuprId||'', partnerDuprEmail:form.partnerDuprEmail||'',
    fileBase64:base64, fileName:file.name, mimeType:file.type,
  };

  const [,result]=await Promise.all([animateBar(2000),postEntry(payload)]);

  // Restore button regardless of outcome
  btn.textContent='Reserve my spot';
  validate(); // re-enables if fields still valid

  if(result&&result.ok){
    finishSuccess();
    if(result.slots) slots=result.slots;
  }else{
    finishError(result&&result.error?result.error:'Something went wrong. Please try again.');
  }
}

async function postEntry(payload){
  // PERF: 30-second timeout with friendly message
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),30000);
  try{
    const res=await fetch(BACKEND_URL,{method:'POST',body:JSON.stringify(payload),signal:ctrl.signal});
    clearTimeout(timer);
    return await res.json();
  }catch(e){
    clearTimeout(timer);
    if(e.name==='AbortError')
      return {ok:false,error:'Taking too long — check your connection and try again.'};
    return {ok:false,error:'Network error. Check your connection and try again.'};
  }
}

/* ---- overlay animation ---- */
function showOverlay(){
  const box=document.getElementById('loadbox');
  box.classList.remove('done','error');
  document.getElementById('loadMsg').textContent='Reserving your spot at the HIVE';
  document.getElementById('loadErr').textContent='';
  document.getElementById('fill').style.width='0%';
  document.getElementById('overlay').classList.add('show');
}
function animateBar(ms){
  return new Promise(res=>{
    const fill=document.getElementById('fill'); let p=0;
    const t=setInterval(()=>{ p++; fill.style.width=p+'%'; if(p>=100){clearInterval(t);res();}},ms/100);
  });
}
function finishSuccess(){
  const box=document.getElementById('loadbox');
  box.classList.add('done');
  document.getElementById('loadMsg').textContent='Spot Reserved at the HIVE';
  setTimeout(()=>{ document.getElementById('overlay').classList.remove('show'); goSelect(); renderCards(); },1000);
}
function finishError(msg){
  const box=document.getElementById('loadbox');
  box.classList.add('error');
  document.getElementById('loadMsg').textContent='Could not reserve';
  document.getElementById('loadErr').textContent=msg;
  setTimeout(()=>document.getElementById('overlay').classList.remove('show'),2500);
}

/* ---- helpers ---- */
function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=rej; r.readAsDataURL(file);
  });
}
function switchScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelector('.wrap').classList.toggle('on-form', id==='screenForm');
  window.scrollTo({top:0,behavior:'smooth'});
}
function goSelect(){ switchScreen('screenSelect'); }

/* ---- init ---- */
loadSlots();
loadLeaderboard();
loadPlayerDirectory();
